name: Public Breast ADC Reference Dataset Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'medical-affairs-agents/adc_reference_dataset.py'
      - 'medical-affairs-agents/abstract_statistic_verifier.py'
      - 'medical-affairs-agents/test_abstract_statistic_verifier.py'
      - 'medical-affairs-agents/test_adc_reference_dataset.py'
      - 'medical-affairs-agents/adc_reviewer_worksheet.py'
      - 'medical-affairs-agents/test_adc_reviewer_worksheet.py'
      - 'medical-affairs-agents/benchmarks/ADC_REFERENCE_CANDIDATES_V1.json'
      - '.github/workflows/adc-reference-packet.yml'

permissions:
  contents: read

jobs:
  reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all offline tests
        run: python -m unittest discover -s medical-affairs-agents -p 'test_*.py' -v
      - name: Audit ten independent breast cancer ADC study records via free PubMed metadata
        run: python medical-affairs-agents/adc_reference_dataset.py
      - name: Generate ten source-specific two-reviewer checklists (unfilled)
        run: python medical-affairs-agents/adc_reviewer_worksheet.py
      - name: Save only article IDs, structured facts, source statuses and readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisional-adc-reference-packet-not-gold
          path: medical-affairs-agents/output/adc_reference_packet/
          retention-days: 14
