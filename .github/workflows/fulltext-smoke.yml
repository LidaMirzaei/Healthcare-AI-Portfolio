name: Full-Text Evidence Prototype Smoke Test
on:
  push:
    paths:
      - '.github/workflows/fulltext-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s medical-affairs-agents -p 'test_*.py' -v
      - name: Retrieve open access full-text and extract evidence
        run: |
          python medical-affairs-agents/fulltext_evidence.py \
            --query '"breast cancer" AND HER2' \
            --limit 3 \
            --out medical-affairs-agents/output/fulltext_evidence.md
      - name: Build cross-study candidate evidence matrix
        run: |
          python medical-affairs-agents/compare_studies.py \
            --query '"breast cancer" AND HER2' \
            --limit 3 \
            --out medical-affairs-agents/output/cross_study_candidates.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: oncology-fulltext-evidence-demo
          path: medical-affairs-agents/output/*.md
          retention-days: 14
