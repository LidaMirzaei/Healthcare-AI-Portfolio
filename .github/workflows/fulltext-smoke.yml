name: Full-Text Evidence Prototype Smoke Test
on:
  push:
    paths:
      - '.github/workflows/fulltext-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fulltext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s medical-affairs-agents -p 'test_*.py' -v
      - name: Retrieve permitted JATS and extract source candidates
        run: |
          python medical-affairs-agents/clinical_effects_v3.py \
            --pmcids PMC12494613 \
            --out medical-affairs-agents/output/fulltext_smoke_safe
      - name: Produce unapproved reviewer queue (no clinical conclusions)
        run: |
          python medical-affairs-agents/evidence_review_queue.py \
            --input medical-affairs-agents/output/fulltext_smoke_safe/v3_effect_candidates.json \
            --out medical-affairs-agents/output/fulltext_smoke_safe
      - name: Upload permitted metadata and evidence candidates only
        uses: actions/upload-artifact@v4
        with:
          name: ontology-fulltext-smoke-safe
          path: medical-affairs-agents/output/fulltext_smoke_safe/
          retention-days: 14
